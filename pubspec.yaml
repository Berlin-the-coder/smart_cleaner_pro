name: smart_cleaner_pro
description: "Smart Cleaner Pro – Storage & Phone Optimizer"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Models (freezed sealed states used across features)
  freezed_annotation: ^2.4.4

  # Navigation
  go_router: ^14.2.7

  # Dependency Injection
  get_it: ^7.7.0

  # Storage / file system
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  disk_space_plus: ^0.2.6
  crypto: ^3.0.5
  video_thumbnail: ^0.5.3
  package_info_plus: ^8.0.2
  gal: ^2.3.0
  usage_stats: ^1.3.0
  url_launcher: ^6.3.1

  
  video_player: ^2.9.2

  # Device / battery
  battery_plus: ^6.0.3

  # UI / animation
  lottie: ^3.3.3
  percent_indicator: ^4.2.3
  google_fonts: ^6.2.1

  # Monetization
  google_mobile_ads: ^5.1.0
  in_app_purchase: ^3.2.0

  # Utils
  logger: ^2.4.0
  shared_preferences: ^2.3.2

  # Image Compressor feature
  image_picker: ^1.2.3
  flutter_image_compress: ^2.3.0
  image: ^4.2.0

  # App Manager feature (Android)
  installed_apps: ^2.1.1
  app_settings: ^5.1.1

  # File Manager feature
  share_plus: ^12.0.0
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  build_runner: ^2.4.12
  freezed: ^2.5.7

  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/icons/
    - assets/animations/

  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700

